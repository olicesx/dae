name: Build (Main)

on:
  push:
    branches:
      - main
      - kdae
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
      - ".github/workflows/seed-build.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  pre-actions:
    # Pinned to a 40-hex commit (P2-25): `@master` moved on every run.
    # daeuniverse/ci-seed-jobs@5d0b8710ae2b7fcc2051e5e9379671c6662b278e
    uses: daeuniverse/ci-seed-jobs/.github/workflows/pre-actions.yml@5d0b8710ae2b7fcc2051e5e9379671c6662b278e
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
      fetch-depth: 0
      check-runs: '["build", "main-build-passed"]'
    # TODO(P2-25): cannot be replaced by an explicit secret mapping until the
    # referenced workflow declares `on.workflow_call.secrets`; see
    # docs/fork-ci-secrets.md for the verified upstream facts, the compensating
    # controls (40-hex pin) and the unblock condition.
    secrets: inherit

  build:
    uses: ./.github/workflows/seed-build.yml
    with:
      ref: ${{ github.sha }}
      build-type: main-build
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  post-actions:
    if: always()
    needs: [build]
    # Pinned to a 40-hex commit (P2-25); see the TODO on pre-actions above.
    uses: daeuniverse/ci-seed-jobs/.github/workflows/dae-post-actions.yml@5d0b8710ae2b7fcc2051e5e9379671c6662b278e
    with:
      check-run-id: "dae-bot[bot]/main-build-passed"
      check-run-conclusion: ${{ needs.build.result }}
    secrets: inherit

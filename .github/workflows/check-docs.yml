name: Check Documents

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    # `kdae` is the development branch of this fork; with only `main` listed
    # this gate never ran on the branch that receives the documentation
    # changes (P3-22).
    branches: [main, kdae]
    types: [ opened, synchronize, reopened ]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'package.json'
      - '.autocorrectrc'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/check-docs.yml'

permissions:
  contents: read

jobs:
  check-doc:
    name: Check document
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm ci
      - name: Lint Markdown files (markdownlint)
        run: |
          npm run markdown-lint
      - name: Lint Markdown files (autocorrect)
        uses: huacnlee/autocorrect-action@main
        with:
          args: --lint ./docs/
      - name: Check broken link (including broken anchor)
        run: |
          npm run check-broken-link

name: Docker

# This job is NOT a gate: branch `kdae` carries no protection rule, so it cannot
# block a merge or a push either way. In this fork it also publishes nothing -
# there are no DockerHub credentials, so `Login to DockerHub` is skipped, `push`
# stays false, and the job reports "build only" through a notice and the step
# summary. What it is worth is the multi-arch build below, and that is why it is
# kept rather than deleted.
#
# The `paths` filter is narrowed to the surfaces that can break that build: a
# full multi-arch build costs 9-12 minutes (measured on runs 34459072603 and
# 34462029090) while the previous filter - `**/*.go`, `**/*.c`, `**/*.h` -
# matched almost every commit. The build is the only push-time path that compiles
# the arm/v7 + trace program, and it is what caught the real failure in
# trace/kern/trace.c on arm (`no member named 'uregs' in 'struct pt_regs'`), so
# the fix is a narrower trigger, not a removal.
#   control/kern/**               eBPF C compiled inside the image
#   trace/kern/**                 the trace C program - the surface that broke
#   Makefile                      the generation logic and the
#                                 TRACE_UNSUPPORTED_GOARCH ledger it reads
#   Dockerfile                    the image recipe
#   .github/workflows/docker.yml  the workflow itself
# Dropped, with the reason:
#   `**/*.go`, `**/*.c`, `**/*.h` - the only non-amd64 Go files in this tree are
#     big-endian (pkg/ebpf_internal/endian_be.go, control/bpf_bpfeb.go), and no
#     Docker platform is big-endian (arm/v7, arm64, amd64 and 386 are all
#     little-endian); amd64 is gated on every push by Build/Go Test/Lint.
#   `go.mod`, `go.sum` - real image inputs (`ADD go.mod go.sum`), but they already
#     trigger bpf-test.yml, which runs scripts/check-trace-arch-matrix.sh, so the
#     arm/trace property stays gated for dependency bumps at a fraction of the
#     cost. Adding them back would raise this filter from 10 to 17 triggers per
#     40 pushes (+70%).
#   `install/friendly-filenames.json`, `scripts/fetch-geo-data.sh` - not inputs to
#     this build: the Dockerfile only runs `make OUTPUT=dae`, and neither the
#     Makefile nor the Dockerfile consumes them (the single mention is a comment
#     about a release-time ARG pin).
# Measured over the last 40 commits on kdae: the previous filter would match 36
# of them and this one 10 (-26 runs, ~3.9-5.2 h at 9-12 min each). `kdae` only
# entered `branches` at f3491dbb, so most of those could not fire at the time; in
# the 10 pushes since, the previous filter ran 7 times and this one matches 5.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      # `kdae` is the development branch of this fork (P3-22).
      - kdae
    paths:
      - "control/kern/**"
      - "trace/kern/**"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  release:
    types: [ prereleased ]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout codebase
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Prepare
        id: prep
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == "refs/tags/v"* ]]; then
            tag=$(git describe --tags $(git rev-list --tags --max-count=1))
            tag=${tag:1}
          else
            tag=$(git log -1 --format="%cd" --date=short | sed s/-//g)
          fi
          # TODO(P3-22 decision-②): this fork still pushes images into the
          # upstream namespace. Changing it is a maintainer decision (who owns
          # the published image identity), so the value is left as-is here.
          echo "IMAGE=daeuniverse/dae" >> $GITHUB_OUTPUT
          echo "TAG=$tag" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2

      # A fork holds no DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secret. Letting the
      # login fail on that (the previous behaviour: `Username and password
      # required`) makes the branch permanently red for a reason that has
      # nothing to do with the code, and skipping the job outright would throw
      # away the multi-arch build check that is the valuable part. So the
      # credentials are probed once: the build always runs, the publish only
      # happens when there is something to publish with, and when there is not,
      # the job says so instead of passing quietly.
      - name: Check publish credentials
        id: credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "DockerHub credentials are configured: the image will be published."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No DockerHub credentials in this repository: the image will be built but not published."
          fi

      - name: Login to DockerHub
        if: steps.credentials.outputs.available == 'true'
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production image
        id: build
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: Dockerfile
          platforms: linux/arm/v7,linux/arm64,linux/amd64,linux/386
          push: ${{ steps.credentials.outputs.available == 'true' }}
          tags: |
            ${{ steps.prep.outputs.IMAGE }}:${{ steps.prep.outputs.TAG }}
            ${{ steps.prep.outputs.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report build-only run (no publish credentials)
        if: always() && steps.credentials.outputs.available == 'false'
        env:
          IMAGE: ${{ steps.prep.outputs.IMAGE }}
          TAG: ${{ steps.prep.outputs.TAG }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [[ "$BUILD_OUTCOME" == "success" ]]; then
            message="Build passed; ${IMAGE}:${TAG} was NOT pushed (no publish credentials)."
          else
            message="Build did not succeed (outcome: ${BUILD_OUTCOME:-skipped}); nothing was pushed (no publish credentials)."
          fi
          echo "::notice::${message}"
          {
            echo "### Docker: build-only run"
            echo
            echo "${message}"
            echo
            echo "This repository has no \`DOCKERHUB_USERNAME\` / \`DOCKERHUB_TOKEN\` secret, so \`Login to DockerHub\` and the push were skipped. Add both as repository secrets to publish; the multi-arch build is still verified by this job."
          } >> "$GITHUB_STEP_SUMMARY"

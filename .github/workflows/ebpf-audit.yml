name: eBPF Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "scripts/ebpf-audit.sh"
      - ".github/workflows/ebpf-audit.yml"
  push:
    branches:
      - main
      - kdae
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "scripts/ebpf-audit.sh"
      - ".github/workflows/ebpf-audit.yml"

permissions: read-all

jobs:
  ebpf_audit:
    name: Load, Verifier, and Dump Audit
    runs-on: ubuntu-22.04
    # The experiment set is owned by the Makefile (DEFAULT_GOEXPERIMENT); the
    # step below applies it without restating it (scripts/check-build-env.sh
    # rejects a literal assignment under .github/). This job runs
    # `go generate`/`go run` directly, so it needs the value in its environment.
    steps:
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go 1.26
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26

      - name: "Apply the canonical build experiments (single owner: Makefile)"
        # P3-19: this job runs `go test` directly, so it must take the value
        # from the Makefile instead of restating it (scripts/check-build-env.sh
        # rejects a literal assignment under .github/). Without this step the
        # unit tests would compile with the toolchain defaults while the
        # released binary carries the experiment set - a silent divergence.
        run: |
          set -euo pipefail
          target="${GITHUB_ENV:?GITHUB_ENV is only set inside GitHub Actions}"
          make -s print-goexperiment-env | tee -a "$target"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang llvm linux-tools-common linux-tools-generic

      - name: Run eBPF audit
        run: |
          export CLANG=clang
          export LLVM_OBJDUMP=llvm-objdump
          ./scripts/ebpf-audit.sh build/ebpf-audit

      - name: Upload eBPF audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ebpf-audit
          path: build/ebpf-audit

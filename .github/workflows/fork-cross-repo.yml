name: Fork Regression

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "component/dnstransport/**"
      - "component/outbound/**"
      - "common/errors/**"
      - "control/udp_endpoint*.go"
      - "control/udp_write_batch*.go"
      - "scripts/fork-cross-repo-test.sh"
      - ".github/workflows/fork-cross-repo.yml"
  push:
    branches:
      - main
      - kdae
    paths:
      - "go.mod"
      - "go.sum"
      - "component/dnstransport/**"
      - "component/outbound/**"
      - "common/errors/**"
      - "control/udp_endpoint*.go"
      - "control/udp_write_batch*.go"
      - "scripts/fork-cross-repo-test.sh"
      - ".github/workflows/fork-cross-repo.yml"
  workflow_dispatch:

permissions: read-all

jobs:
  fork-tests:
    name: Fork ${{ matrix.mode }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: unit
            test_args: ""
          - mode: race
            test_args: "-race -p=1"
    steps:
      - name: Checkout dae
        uses: actions/checkout@v6

      - name: Set up Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      # Dependency package tests are not included by dae's own ./... tests.
      # Keep this in dae's module graph; standalone fork tests below use each
      # fork's own graph and also prepare QPACK's submodule-only interop corpus.
      - name: Test forks in dae dependency graph
        env:
          GOWORK: "off"
        run: |
          go test -mod=readonly -short -timeout 10m ${{ matrix.test_args }} \
            ./component/dnstransport \
            github.com/daeuniverse/outbound/... \
            github.com/olicesx/quic-go \
            github.com/olicesx/quic-go/http3 \
            github.com/olicesx/qpack

      - name: Test pinned fork revisions
        env:
          FORK_TEST_TIMEOUT: "1800"
        run: bash scripts/fork-cross-repo-test.sh --clone-missing --short --strict -- ${{ matrix.test_args }}

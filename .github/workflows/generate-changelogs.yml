name: Generate Changelogs
run-name: 'chore(release): generate changelogs for ${{ inputs.previous_release_tag }}..${{ inputs.future_release_tag }}'

on:
  workflow_dispatch:
    inputs:
      previous_release_tag:
        required: true
        description: previous release tag
      future_release_tag:
        required: true
        description: future release tag
      dry_run:
        required: true
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Generate changelogs
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block: `contents: read`
    # must be listed again, otherwise `actions/checkout` runs with
    # contents: none.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate GitHub Auth Token
        # https://github.com/tibdex/github-app-token
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Generate release changelogs
        uses: daeuniverse/changelogs-generator-action@0db5f70682f230ffb732bf17807dd9ad0ce24cf4 # main
        id: changelog
        with:
          # https://github.com/daeuniverse/changelogs-generator-action
          previousRelease: ${{ inputs.previous_release_tag }}
          futureRelease: ${{ inputs.future_release_tag }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Print outputs
        shell: bash
        run: |
          echo "${{ steps.changelog.outputs.changelogs }}"

      - name: Create an issue with proposed changelogs
        if: ${{ inputs.dry_run == 'false' }}
        uses: dacbd/create-issue-action@fec641442c0897e734fad173cfe83ae21a2284a3 # main
        with:
          token: ${{ steps.generate_token.outputs.token }}
          title: '[Release Changelogs] ${{ inputs.future_release_tag }}'
          labels: automated-issue,release
          assignees: "sumire88,mzz2017,kunish,jschwinger233"
          body: |
            ${{ steps.changelog.outputs.changelogs }}
